<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Roboto, system-ui, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a73e8"/>
      <stop offset="0.55" stop-color="#4285f4"/>
      <stop offset="1" stop-color="#174ea6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- wallpaper -->
  <rect width="960" height="600" rx="10" fill="url(#wall)"/>
  <circle cx="770" cy="130" r="180" fill="#ffffff" opacity="0.06"/>
  <circle cx="180" cy="90" r="120" fill="#ffffff" opacity="0.05"/>

  <!-- ===== Launcher bubble ===== -->
  <g filter="url(#shadow)">
    <rect x="40" y="150" width="430" height="340" rx="24" fill="#202124" fill-opacity="0.94" stroke="#ffffff" stroke-opacity="0.10"/>
    <!-- search -->
    <rect x="64" y="176" width="382" height="44" rx="22" fill="#35363a"/>
    <circle cx="92" cy="198" r="9" fill="none" stroke="#9aa0a6" stroke-width="2.4"/>
    <line x1="99" y1="205" x2="106" y2="212" stroke="#9aa0a6" stroke-width="2.4" stroke-linecap="round"/>
    <text x="120" y="203" fill="#5f6368" font-size="15">Search your apps</text>
    <text x="64" y="252" fill="#9aa0a6" font-size="12" font-weight="600">ALL APPS</text>
    <!-- app grid -->
    <g>
      <g transform="translate(80,268)">
        <rect width="48" height="48" rx="12" fill="#8ab4f8"/><text x="72" y="70" fill="#e8eaed" font-size="11" text-anchor="middle">Chrome</text>
      </g>
      <g transform="translate(176,268)">
        <rect width="48" height="48" rx="12" fill="#fdd663"/><text x="24" y="70" fill="#e8eaed" font-size="11" text-anchor="middle">Files</text>
      </g>
      <g transform="translate(272,268)">
        <rect width="48" height="48" rx="12" fill="#81c995"/><text x="24" y="70" fill="#e8eaed" font-size="11" text-anchor="middle">Docs</text>
      </g>
      <g transform="translate(368,268)">
        <rect width="48" height="48" rx="12" fill="#f28b82"/><text x="24" y="70" fill="#e8eaed" font-size="11" text-anchor="middle">Photos</text>
      </g>
      <g transform="translate(80,356)">
        <rect width="48" height="48" rx="12" fill="#c58af9"/><text x="24" y="70" fill="#e8eaed" font-size="11" text-anchor="middle">Calc</text>
      </g>
      <g transform="translate(176,356)">
        <rect width="48" height="48" rx="12" fill="#78d9ec"/><text x="24" y="70" fill="#e8eaed" font-size="11" text-anchor="middle">Term</text>
      </g>
      <g transform="translate(272,356)">
        <rect width="48" height="48" rx="12" fill="#fcad70"/><text x="24" y="70" fill="#e8eaed" font-size="11" text-anchor="middle">Music</text>
      </g>
      <g transform="translate(368,356)">
        <rect width="48" height="48" rx="12" fill="#a1a7ad"/><text x="24" y="70" fill="#e8eaed" font-size="11" text-anchor="middle">Settings</text>
      </g>
    </g>
  </g>

  <!-- ===== Quick settings bubble ===== -->
  <g filter="url(#shadow)">
    <rect x="620" y="200" width="300" height="290" rx="24" fill="#202124" fill-opacity="0.94" stroke="#ffffff" stroke-opacity="0.10"/>
    <!-- pods -->
    <g>
      <rect x="640" y="220" width="128" height="56" rx="16" fill="#8ab4f8"/>
      <circle cx="668" cy="248" r="16" fill="#ffffff" fill-opacity="0.25"/>
      <text x="692" y="244" fill="#062e6f" font-size="13" font-weight="600">Network</text>
      <text x="692" y="260" fill="#062e6f" font-size="10" opacity="0.8">Home Wi-Fi</text>

      <rect x="776" y="220" width="128" height="56" rx="16" fill="#35363a"/>
      <circle cx="804" cy="248" r="16" fill="#202124"/>
      <text x="828" y="244" fill="#e8eaed" font-size="13" font-weight="600">Bluetooth</text>
      <text x="828" y="260" fill="#9aa0a6" font-size="10">Off</text>

      <rect x="640" y="284" width="128" height="56" rx="16" fill="#35363a"/>
      <circle cx="668" cy="312" r="16" fill="#202124"/>
      <text x="692" y="308" fill="#e8eaed" font-size="13" font-weight="600">Do not</text>
      <text x="692" y="324" fill="#9aa0a6" font-size="10">disturb</text>

      <rect x="776" y="284" width="128" height="56" rx="16" fill="#35363a"/>
      <circle cx="804" cy="312" r="16" fill="#202124"/>
      <text x="828" y="308" fill="#e8eaed" font-size="13" font-weight="600">Night</text>
      <text x="828" y="324" fill="#9aa0a6" font-size="10">Light</text>
    </g>
    <!-- sliders -->
    <rect x="640" y="352" width="264" height="28" rx="14" fill="#35363a"/>
    <rect x="640" y="352" width="150" height="28" rx="14" fill="#8ab4f8"/>
    <circle cx="654" cy="366" r="8" fill="#062e6f"/>
    <rect x="640" y="388" width="264" height="28" rx="14" fill="#35363a"/>
    <rect x="640" y="388" width="200" height="28" rx="14" fill="#8ab4f8"/>
    <circle cx="654" cy="402" r="8" fill="#062e6f"/>
    <!-- footer -->
    <line x1="640" y1="430" x2="904" y2="430" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="640" y="456" fill="#e8eaed" font-size="12" font-weight="600">Monday, September 15</text>
    <text x="640" y="472" fill="#9aa0a6" font-size="10">78% • 3 hr 20 min left</text>
    <circle cx="838" cy="460" r="14" fill="#35363a"/>
    <circle cx="872" cy="460" r="14" fill="#35363a"/>
    <circle cx="906" cy="460" r="14" fill="#35363a" opacity="0"/>
  </g>

  <!-- ===== Shelf ===== -->
  <rect x="0" y="536" width="960" height="64" fill="#22242a" fill-opacity="0.78"/>
  <rect x="0" y="536" width="960" height="1" fill="#ffffff" fill-opacity="0.10"/>

  <!-- launcher button -->
  <circle cx="40" cy="568" r="17" fill="#f1f3f4"/>
  <circle cx="40" cy="568" r="6" fill="#8ab4f8"/>

  <!-- centered apps -->
  <g transform="translate(408,546)">
    <rect x="0"  y="0" width="44" height="44" rx="12" fill="#8ab4f8"/>
    <rect x="52" y="0" width="44" height="44" rx="12" fill="#fdd663"/>
    <rect x="104" y="0" width="44" height="44" rx="12" fill="#81c995"/>
    <rect x="156" y="0" width="44" height="44" rx="12" fill="#a1a7ad"/>
    <!-- running indicators -->
    <rect x="14" y="48" width="16" height="3" rx="1.5" fill="#8ab4f8"/>
    <rect x="70" y="48" width="6"  height="3" rx="1.5" fill="#9aa0a6"/>
  </g>

  <!-- status area -->
  <g transform="translate(812,548)">
    <rect x="0" y="0" width="116" height="40" rx="20" fill="#35363a"/>
    <text x="16" y="25" fill="#e8eaed" font-size="13">📶</text>
    <text x="42" y="25" fill="#81c995" font-size="13">🔋</text>
    <text x="70" y="25" fill="#e8eaed" font-size="13" font-weight="600">9:41</text>
  </g>

  <text x="480" y="30" fill="#ffffff" font-size="16" font-weight="600" text-anchor="middle" opacity="0.9">quickshell-chrome</text>
</svg>
